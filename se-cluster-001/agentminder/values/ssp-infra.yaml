# ssp-infra (chart 4.1.0+1578): AgentMinder's database (Percona XtraDB
# Cluster, one node) and ClickHouse (agent telemetry).
#
#   helm install infra-ssp ssp-infra --repo https://ssp_helm_charts.storage.googleapis.com/agentminder-charts/ \
#     --version 4.1.0+1578 -n agentminder -f se-cluster-001/agentminder/values/ssp-infra.yaml --timeout=120m
#
# Differences from the lab guide's file, on purpose:
# - fluent-bit off: it ships platform logs to the Elasticsearch of the
#   "enclave" monitoring stack, which this lab skips (~7 cores / 16 GB).
#   AgentMinder's own agent telemetry (ClickHouse) is unaffected.
# - smaller volumes: lab, not production.
# No secrets here: the image pull secret is created by hand (step 3).

# Must equal the release name of the ssp chart (helm install ssp ...).
sspReleaseName: ssp

global:
  registry:
    existingSecrets:
    - name: ssp-gcr-registry-creds

db:
  enabled: true
  persistence:
    size: 20Gi          # chart default 80Gi

clickhouse:
  # Required for AgentMinder observability. Its CRDs must be applied before
  # this chart (docs/agentminder.md, step 4): the chart refuses otherwise.
  enabled: true
  storage: 20Gi         # chart default 50Gi
  # Delete, not the cluster default (Retain): lab data.
  storageClassName: vsan-default-storage-policy

fluent-bit:
  enabled: false
