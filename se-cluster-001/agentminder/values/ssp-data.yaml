# ssp-data (chart 2026.26): loads the risk-engine schema and network / IP
# reference data (risk-based authentication, geolocation) into the platform
# database. Last of the three charts.
#
#   helm install data-ssp ssp-data --repo https://ssp_helm_charts.storage.googleapis.com/agentminder-charts/ \
#     --version 2026.26 -n agentminder -f se-cluster-001/agentminder/values/ssp-data.yaml --timeout=60m
sspReleaseName: ssp
ssp:
  global:
    ssp:
      registry:
        existingSecrets:
        - name: ssp-gcr-registry-creds
