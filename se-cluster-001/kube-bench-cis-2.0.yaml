# CIS Kubernetes Benchmark 2.0 scan of a VKS cluster with kube-bench.
# Procedure, expected results and how to update: docs/cis-scan.md
#
#   C=se-cluster-001:se-cluster-001
#   kubectl --context $C apply -f se-cluster-001/kube-bench-cis-2.0.yaml
#   kubectl --context $C -n kube-bench wait --for=condition=complete job --all --timeout=300s
#   kubectl --context $C -n kube-bench logs job/kube-bench-controlplane > cis-2.0-controlplane.txt
#   kubectl --context $C -n kube-bench logs job/kube-bench-worker       > cis-2.0-worker.txt
#   kubectl --context $C delete ns kube-bench      # removes everything below
#
# Applied INSIDE the workload cluster. A one-off scan, not managed by ArgoCD.
#
# Read-only: kube-bench only reads host files and process flags; every host
# mount below is readOnly. Based on the upstream job-master.yaml and
# job-node.yaml from kube-bench v0.16.0, adapted for VKS:
#
# - CIS Kubernetes Benchmark 2.0, the current generation for Kubernetes 1.34
#   and 1.35. The latest kube-bench release (v0.16.0) only ships checks up to
#   CIS 1.12; the 2.0 checks exist on kube-bench's main branch but are not in a
#   release yet. They needed no code change, so the released v0.16.0 image runs
#   them from the ConfigMaps at the end of this file (copied from kube-bench
#   commit e278a5915a98) via --config-dir. Swap to a release image
#   and drop the ConfigMaps once kube-bench ships CIS 2.0.
# - VKS enforces the Pod Security "restricted" profile cluster-wide. kube-bench
#   needs hostPID and hostPath, so its namespace is labelled privileged, the
#   same way VKS labels its own system namespaces.
# - VKS taints control-plane nodes; the control-plane Job tolerates the taint,
#   or it stays Pending.
apiVersion: v1
kind: Namespace
metadata:
  name: kube-bench
  labels:
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/warn: privileged
    pod-security.kubernetes.io/audit: privileged
---
# Control plane: API server, controller manager, scheduler, etcd, and the
# policy section (RBAC, pod security, network policy, secrets).
apiVersion: batch/v1
kind: Job
metadata:
  name: kube-bench-controlplane
  namespace: kube-bench
spec:
  backoffLimit: 0
  template:
    spec:
      hostPID: true
      restartPolicy: Never
      nodeSelector:
        node-role.kubernetes.io/control-plane: ""
      tolerations:
      # VKS taints control-plane nodes; without this the pod stays Pending.
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
      containers:
      - name: kube-bench
        image: docker.io/aquasec/kube-bench:v0.16.0
        command: ["kube-bench", "run", "--benchmark", "cis-2.0",
                  "--config-dir", "/opt/kube-bench/cfg-2.0", "--config", "/opt/kube-bench/cfg-2.0/config.yaml",
                  "--targets", "master,controlplane,etcd,policies"]
        volumeMounts:
        - {name: var-lib-cni, mountPath: /var/lib/cni, readOnly: true}
        - {name: var-lib-etcd, mountPath: /var/lib/etcd, readOnly: true}
        - {name: var-lib-kubelet, mountPath: /var/lib/kubelet, readOnly: true}
        - {name: var-lib-kube-scheduler, mountPath: /var/lib/kube-scheduler, readOnly: true}
        - {name: var-lib-kube-controller-manager, mountPath: /var/lib/kube-controller-manager, readOnly: true}
        - {name: etc-systemd, mountPath: /etc/systemd, readOnly: true}
        - {name: lib-systemd, mountPath: /lib/systemd/, readOnly: true}
        - {name: srv-kubernetes, mountPath: /srv/kubernetes/, readOnly: true}
        - {name: etc-kubernetes, mountPath: /etc/kubernetes, readOnly: true}
        - {name: usr-bin, mountPath: /usr/local/mount-from-host/bin, readOnly: true}
        - {name: etc-cni-netd, mountPath: /etc/cni/net.d/, readOnly: true}
        - {name: opt-cni-bin, mountPath: /opt/cni/bin/, readOnly: true}
        - {name: etc-passwd, mountPath: /etc/passwd, readOnly: true}
        - {name: etc-group, mountPath: /etc/group, readOnly: true}
        - {name: cfg-2-0, mountPath: /opt/kube-bench/cfg-2.0, readOnly: true}
      volumes:
      - {name: var-lib-cni, hostPath: {path: /var/lib/cni}}
      - {name: var-lib-etcd, hostPath: {path: /var/lib/etcd}}
      - {name: var-lib-kubelet, hostPath: {path: /var/lib/kubelet}}
      - {name: var-lib-kube-scheduler, hostPath: {path: /var/lib/kube-scheduler}}
      - {name: var-lib-kube-controller-manager, hostPath: {path: /var/lib/kube-controller-manager}}
      - {name: etc-systemd, hostPath: {path: /etc/systemd}}
      - {name: lib-systemd, hostPath: {path: /lib/systemd}}
      - {name: srv-kubernetes, hostPath: {path: /srv/kubernetes}}
      - {name: etc-kubernetes, hostPath: {path: /etc/kubernetes}}
      - {name: usr-bin, hostPath: {path: /usr/bin}}
      - {name: etc-cni-netd, hostPath: {path: /etc/cni/net.d/}}
      - {name: opt-cni-bin, hostPath: {path: /opt/cni/bin/}}
      - {name: etc-passwd, hostPath: {path: /etc/passwd}}
      - {name: etc-group, hostPath: {path: /etc/group}}
      - name: cfg-2-0
        projected:
          sources:
          - configMap:
              name: kube-bench-cfg
              items: [{key: config.yaml, path: config.yaml}]
          - configMap:
              name: kube-bench-cis-2.0
              items:
              - {key: config.yaml, path: cis-2.0/config.yaml}
              - {key: controlplane.yaml, path: cis-2.0/controlplane.yaml}
              - {key: etcd.yaml, path: cis-2.0/etcd.yaml}
              - {key: master.yaml, path: cis-2.0/master.yaml}
              - {key: node.yaml, path: cis-2.0/node.yaml}
              - {key: policies.yaml, path: cis-2.0/policies.yaml}
---
# Worker: kubelet and node configuration. One worker is enough, since every
# worker boots from the same VKr image.
apiVersion: batch/v1
kind: Job
metadata:
  name: kube-bench-worker
  namespace: kube-bench
spec:
  backoffLimit: 0
  template:
    spec:
      hostPID: true
      restartPolicy: Never
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: node-role.kubernetes.io/control-plane
                operator: DoesNotExist
      containers:
      - name: kube-bench
        image: docker.io/aquasec/kube-bench:v0.16.0
        command: ["kube-bench", "run", "--benchmark", "cis-2.0",
                  "--config-dir", "/opt/kube-bench/cfg-2.0", "--config", "/opt/kube-bench/cfg-2.0/config.yaml", "--targets", "node"]
        volumeMounts:
        - {name: var-lib-cni, mountPath: /var/lib/cni, readOnly: true}
        - {name: var-lib-etcd, mountPath: /var/lib/etcd, readOnly: true}
        - {name: var-lib-kubelet, mountPath: /var/lib/kubelet, readOnly: true}
        - {name: var-lib-kube-scheduler, mountPath: /var/lib/kube-scheduler, readOnly: true}
        - {name: var-lib-kube-controller-manager, mountPath: /var/lib/kube-controller-manager, readOnly: true}
        - {name: etc-systemd, mountPath: /etc/systemd, readOnly: true}
        - {name: lib-systemd, mountPath: /lib/systemd/, readOnly: true}
        - {name: srv-kubernetes, mountPath: /srv/kubernetes/, readOnly: true}
        - {name: etc-kubernetes, mountPath: /etc/kubernetes, readOnly: true}
        - {name: usr-bin, mountPath: /usr/local/mount-from-host/bin, readOnly: true}
        - {name: etc-cni-netd, mountPath: /etc/cni/net.d/, readOnly: true}
        - {name: opt-cni-bin, mountPath: /opt/cni/bin/, readOnly: true}
        - {name: cfg-2-0, mountPath: /opt/kube-bench/cfg-2.0, readOnly: true}
        - {name: etc-passwd, mountPath: /etc/passwd, readOnly: true}
        - {name: etc-group, mountPath: /etc/group, readOnly: true}
      volumes:
      - {name: var-lib-cni, hostPath: {path: /var/lib/cni}}
      - {name: var-lib-etcd, hostPath: {path: /var/lib/etcd}}
      - {name: var-lib-kubelet, hostPath: {path: /var/lib/kubelet}}
      - {name: var-lib-kube-scheduler, hostPath: {path: /var/lib/kube-scheduler}}
      - {name: var-lib-kube-controller-manager, hostPath: {path: /var/lib/kube-controller-manager}}
      - {name: etc-systemd, hostPath: {path: /etc/systemd}}
      - {name: lib-systemd, hostPath: {path: /lib/systemd}}
      - {name: srv-kubernetes, hostPath: {path: /srv/kubernetes}}
      - {name: etc-kubernetes, hostPath: {path: /etc/kubernetes}}
      - {name: usr-bin, hostPath: {path: /usr/bin}}
      - {name: etc-cni-netd, hostPath: {path: /etc/cni/net.d/}}
      - {name: opt-cni-bin, hostPath: {path: /opt/cni/bin/}}
      - name: cfg-2-0
        projected:
          sources:
          - configMap:
              name: kube-bench-cfg
              items: [{key: config.yaml, path: config.yaml}]
          - configMap:
              name: kube-bench-cis-2.0
              items:
              - {key: config.yaml, path: cis-2.0/config.yaml}
              - {key: controlplane.yaml, path: cis-2.0/controlplane.yaml}
              - {key: etcd.yaml, path: cis-2.0/etcd.yaml}
              - {key: master.yaml, path: cis-2.0/master.yaml}
              - {key: node.yaml, path: cis-2.0/node.yaml}
              - {key: policies.yaml, path: cis-2.0/policies.yaml}
      - {name: etc-passwd, hostPath: {path: /etc/passwd}}
      - {name: etc-group, hostPath: {path: /etc/group}}
---
# kube-bench config, copied from aquasecurity/kube-bench@e278a5915a982f2756026de6e2f9ca77077ef9f9 cfg/config.yaml
apiVersion: v1
data:
  config.yaml: |
    ---
    ## Controls Files.
    # These are YAML files that hold all the details for running checks.
    #
    ## Uncomment to use different control file paths.
    # masterControls: ./cfg/master.yaml
    # nodeControls: ./cfg/node.yaml

    master:
      components:
        - apiserver
        - scheduler
        - controllermanager
        - etcd
        - flanneld
        # kubernetes is a component to cover the config file /etc/kubernetes/config that is referred to in the benchmark
        - kubernetes
        - kubelet

      kubernetes:
        defaultconf: /etc/kubernetes/config

      apiserver:
        bins:
          - "kube-apiserver"
          - "hyperkube apiserver"
          - "hyperkube kube-apiserver"
          - "apiserver"
          - "openshift start master api"
          - "hypershift openshift-kube-apiserver"
        confs:
          - /etc/kubernetes/manifests/kube-apiserver.yaml
          - /etc/kubernetes/manifests/kube-apiserver.yml
          - /etc/kubernetes/manifests/kube-apiserver.manifest
          - /var/snap/kube-apiserver/current/args
          - /var/snap/microk8s/current/args/kube-apiserver
          - /etc/origin/master/master-config.yaml
          - /etc/kubernetes/manifests/talos-kube-apiserver.yaml
          - /var/lib/rancher/rke2/agent/pod-manifests/kube-apiserver.yaml
        defaultconf: /etc/kubernetes/manifests/kube-apiserver.yaml

      scheduler:
        bins:
          - "kube-scheduler"
          - "hyperkube scheduler"
          - "hyperkube kube-scheduler"
          - "scheduler"
          - "openshift start master controllers"
        confs:
          - /etc/kubernetes/manifests/kube-scheduler.yaml
          - /etc/kubernetes/manifests/kube-scheduler.yml
          - /etc/kubernetes/manifests/kube-scheduler.manifest
          - /var/snap/kube-scheduler/current/args
          - /var/snap/microk8s/current/args/kube-scheduler
          - /etc/origin/master/scheduler.json
          - /etc/kubernetes/manifests/talos-kube-scheduler.yaml
          - /var/lib/rancher/rke2/agent/pod-manifests/kube-scheduler.yaml
        defaultconf: /etc/kubernetes/manifests/kube-scheduler.yaml
        kubeconfig:
          - /etc/kubernetes/scheduler.conf
          - /var/lib/kube-scheduler/kubeconfig
          - /var/lib/kube-scheduler/config.yaml
          - /var/lib/rancher/rke2/server/cred/scheduler.kubeconfig
          - /system/secrets/kubernetes/kube-scheduler/kubeconfig
        defaultkubeconfig: /etc/kubernetes/scheduler.conf

      controllermanager:
        bins:
          - "kube-controller-manager"
          - "kube-controller"
          - "hyperkube controller-manager"
          - "hyperkube kube-controller-manager"
          - "controller-manager"
          - "openshift start master controllers"
          - "hypershift openshift-controller-manager"
        confs:
          - /etc/kubernetes/manifests/kube-controller-manager.yaml
          - /etc/kubernetes/manifests/kube-controller-manager.yml
          - /etc/kubernetes/manifests/kube-controller-manager.manifest
          - /var/snap/kube-controller-manager/current/args
          - /var/snap/microk8s/current/args/kube-controller-manager
          - /etc/kubernetes/manifests/talos-kube-controller-manager.yaml
          - /var/lib/rancher/rke2/agent/pod-manifests/kube-controller-manager.yaml
        defaultconf: /etc/kubernetes/manifests/kube-controller-manager.yaml
        kubeconfig:
          - /etc/kubernetes/controller-manager.conf
          - /var/lib/kube-controller-manager/kubeconfig
          - /var/lib/rancher/rke2/server/cred/controller.kubeconfig
          - /system/secrets/kubernetes/kube-controller-manager/kubeconfig
        defaultkubeconfig: /etc/kubernetes/controller-manager.conf

      etcd:
        optional: true
        bins:
          - "etcd"
          - "openshift start etcd"
        datadirs:
          - /var/lib/etcd/default.etcd
          - /var/lib/etcd/data.etcd
          - /var/lib/rancher/k3s/server/db/etcd
        confs:
          - /etc/kubernetes/manifests/etcd.yaml
          - /etc/kubernetes/manifests/etcd.yml
          - /etc/kubernetes/manifests/etcd.manifest
          - /etc/etcd/etcd.conf
          - /var/snap/etcd/common/etcd.conf.yml
          - /var/snap/etcd/common/etcd.conf.yaml
          - /var/snap/microk8s/current/args/etcd
          - /usr/lib/systemd/system/etcd.service
          - /var/lib/rancher/rke2/server/db/etcd/config
          - /var/lib/rancher/k3s/server/db/etcd/config
        defaultconf: /etc/kubernetes/manifests/etcd.yaml
        defaultdatadir: /var/lib/etcd/default.etcd
        client_cert_file: /var/lib/rancher/rke2/server/tls/etcd/server-client.crt
        client_key_file: /var/lib/rancher/rke2/server/tls/etcd/server-client.key


      flanneld:
        optional: true
        bins:
          - flanneld
        defaultconf: /etc/sysconfig/flanneld

      kubelet:
        optional: true
        bins:
          - "hyperkube kubelet"
          - "kubelet"

    node:
      components:
        - kubelet
        - proxy
        # kubernetes is a component to cover the config file /etc/kubernetes/config that is referred to in the benchmark
        - kubernetes

      kubernetes:
        defaultconf: "/etc/kubernetes/config"

      kubelet:
        cafile:
          - "/var/lib/rancher/rke2/agent/client-ca.crt"
          - "/var/lib/rancher/rke2/server/tls/server-ca.crt"
          - "/etc/kubernetes/pki/ca.crt"
          - "/etc/kubernetes/certs/ca.crt"
          - "/etc/kubernetes/cert/ca.pem"
          - "/var/snap/microk8s/current/certs/ca.crt"
          - "/var/lib/rancher/rke2/agent/server.crt"
          - "/var/lib/rancher/k3s/agent/client-ca.crt"
        svc:
          # These paths must also be included
          #  in the 'confs' property below
          - "/etc/systemd/system/kubelet.service.d/10-kubeadm.conf"
          - "/etc/systemd/system/kubelet.service"
          - "/lib/systemd/system/kubelet.service"
          - "/etc/systemd/system/snap.kubelet.daemon.service"
          - "/etc/systemd/system/snap.microk8s.daemon-kubelet.service"
          - "/etc/systemd/system/atomic-openshift-node.service"
          - "/etc/systemd/system/origin-node.service"
        bins:
          - "hyperkube kubelet"
          - "kubelet"
        kubeconfig:
          - "/etc/kubernetes/kubelet.conf"
          - "/etc/kubernetes/kubelet-kubeconfig.conf"
          - "/var/lib/kubelet/kubeconfig"
          - "/etc/kubernetes/kubelet-kubeconfig"
          - "/etc/kubernetes/kubelet/kubeconfig"
          - "/etc/kubernetes/ssl/kubecfg-kube-node.yaml"
          - "/var/snap/microk8s/current/credentials/kubelet.config"
          - "/etc/kubernetes/kubeconfig-kubelet"
          - "/var/lib/rancher/rke2/agent/kubelet.kubeconfig"
          - "/var/lib/rancher/k3s/agent/kubelet.kubeconfig"
        confs:
          - "/etc/kubernetes/kubelet-config.yaml"
          - "/etc/kubernetes/kubelet/kubelet-config.json"
          - "/var/lib/rancher/rke2/agent/etc/kubelet.conf.d"
          - "/var/lib/kubelet/config.yaml"
          - "/etc/kubernetes/azure.json"
          - "/var/lib/kubelet/config.yml"
          - "/etc/kubernetes/kubelet/kubelet-config.json"
          - "/etc/kubernetes/kubelet/config.json"
          - "/etc/kubernetes/kubelet/config"
          - "/home/kubernetes/kubelet-config.yaml"
          - "/home/kubernetes/kubelet-config.yml"
          - "/etc/default/kubeletconfig.json"
          - "/etc/default/kubelet"
          - "/var/lib/kubelet/kubeconfig"
          - "/var/snap/kubelet/current/args"
          - "/var/snap/microk8s/current/args/kubelet"
          ## Due to the fact that the kubelet might be configured
          ## without a kubelet-config file, we use a work-around
          ## of pointing to the systemd service file (which can also
          ## hold kubelet configuration).
          ## Note: The following paths must match the one under 'svc'
          - "/etc/systemd/system/kubelet.service.d/10-kubeadm.conf"
          - "/etc/systemd/system/kubelet.service"
          - "/lib/systemd/system/kubelet.service"
          - "/etc/systemd/system/snap.kubelet.daemon.service"
          - "/etc/systemd/system/snap.microk8s.daemon-kubelet.service"
          - "/etc/kubernetes/kubelet.yaml"

        defaultconf: "/var/lib/kubelet/config.yaml"
        defaultsvc: "/etc/systemd/system/kubelet.service.d/10-kubeadm.conf"
        defaultkubeconfig: "/etc/kubernetes/kubelet.conf"
        defaultcafile: "/etc/kubernetes/pki/ca.crt"

      proxy:
        optional: true
        bins:
          - "kube-proxy"
          - "hyperkube proxy"
          - "hyperkube kube-proxy"
          - "proxy"
          - "openshift start network"
        confs:
          - /etc/kubernetes/proxy
          - /etc/kubernetes/addons/kube-proxy-daemonset.yaml
          - /etc/kubernetes/addons/kube-proxy-daemonset.yml
          - /var/snap/kube-proxy/current/args
          - /var/snap/microk8s/current/args/kube-proxy
        kubeconfig:
          - "/etc/kubernetes/kubelet-kubeconfig"
          - "/etc/kubernetes/kubelet-kubeconfig.conf"
          - "/etc/kubernetes/kubelet/config"
          - "/etc/kubernetes/ssl/kubecfg-kube-proxy.yaml"
          - "/var/lib/kubelet/kubeconfig"
          - "/var/snap/microk8s/current/credentials/proxy.config"
          - "/var/lib/rancher/rke2/agent/kubeproxy.kubeconfig"
          - "/var/lib/rancher/k3s/agent/kubeproxy.kubeconfig"
        svc:
          - "/lib/systemd/system/kube-proxy.service"
          - "/etc/systemd/system/snap.microk8s.daemon-proxy.service"
        defaultconf: /etc/kubernetes/addons/kube-proxy-daemonset.yaml
        defaultkubeconfig: "/etc/kubernetes/proxy.conf"

    etcd:
      components:
        - etcd

      etcd:
        bins:
          - "etcd"
        datadirs:
          - /var/lib/etcd/default.etcd
          - /var/lib/etcd/data.etcd
          - /var/lib/rancher/k3s/server/db/etcd
        confs:
          - /var/lib/rancher/rke2/server/db/etcd/config
          - /var/lib/rancher/rke2/agent/pod-manifests/etcd.yaml
          - /etc/kubernetes/manifests/etcd.yaml
          - /etc/kubernetes/manifests/etcd.yml
          - /etc/kubernetes/manifests/etcd.manifest
          - /etc/etcd/etcd.conf
          - /var/snap/etcd/common/etcd.conf.yml
          - /var/snap/etcd/common/etcd.conf.yaml
          - /var/snap/microk8s/current/args/etcd
          - /usr/lib/systemd/system/etcd.service
          - /var/lib/rancher/k3s/server/db/etcd/config
        defaultconf: /etc/kubernetes/manifests/etcd.yaml
        defaultdatadir: /var/lib/etcd/default.etcd

    controlplane:
      components:
        - apiserver

      apiserver:
        bins:
          - "kube-apiserver"
          - "hyperkube apiserver"
          - "hyperkube kube-apiserver"
          - "apiserver"

    policies:
      components: []

    managedservices:
      components: []

    version_mapping:
      "1.15": "cis-1.5"
      "1.16": "cis-1.6"
      "1.17": "cis-1.6"
      "1.18": "cis-1.6"
      "1.19": "cis-1.20"
      "1.20": "cis-1.20"
      "1.21": "cis-1.20"
      "1.22": "cis-1.23"
      "1.23": "cis-1.23"
      "1.24": "cis-1.24"
      "1.25": "cis-1.7"
      "1.26": "cis-1.8"
      "1.27": "cis-1.9"
      "1.28": "cis-1.10"
      "1.29": "cis-1.11"
      "1.30": "cis-1.11"
      "1.31": "cis-1.11"
      "1.32": "cis-1.12"
      "1.33": "cis-1.12"
      "1.34": "cis-2.0"
      "1.35": "cis-2.0"
      "eks-1.0.1": "eks-1.0.1"
      "eks-1.1.0": "eks-1.1.0"
      "eks-1.2.0": "eks-1.2.0"
      "eks-1.5.0": "eks-1.5.0"
      "eks-1.7.0": "eks-1.7.0"
      "eks-1.8.0": "eks-1.8.0"
      "gke-1.0": "gke-1.0"
      "gke-1.2.0": "gke-1.2.0"
