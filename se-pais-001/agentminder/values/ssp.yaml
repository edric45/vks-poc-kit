# ssp (chart 4.1.0+1578): the AgentMinder platform, demo size, with the
# in-platform AI Gateway and observability on.
#
#   helm install ssp ssp --repo https://ssp_helm_charts.storage.googleapis.com/agentminder-charts/ \
#     --version 4.1.0+1578 -n agentminder -f se-pais-001/agentminder/values/ssp.yaml --timeout=120m
#
# Install ONLY after ssp-infra is up: this chart looks up the database
# (PerconaXtraDBCluster) and ClickHouse in the cluster at install time and
# fails if they are missing. (The same lookups are why it can't be synced by
# ArgoCD, which renders charts without a cluster.)
#
# Based on the lab guide's demo file; differences on purpose:
# - attaches to our Gateway "agentminder" (se-pais-001/agentminder/gateway.yaml)
#   instead of creating one, so the sslip.io name is known before install.
ssp:
  deployment:
    size: demo            # single replica, 60 authentications/min
  ingress:
    # The Gateway's sslip.io name (Gateway address 172.19.0.31); same name as
    # the Certificate in gateway.yaml. The chart also routes "mgmt-" + host.
    host: agentminder.172-19-0-31.sslip.io
    type: gatewayapi
    tls:
      # The cert-manager certificate on our Gateway.
      secretName: agentminder-tls
    gatewayApi:
      gatewayType: envoy
      createGateway: false
      existingGateway: agentminder
      skipWildcardListener: true
      # Our Gateway has no port-80 listener to redirect from.
      httpToHttpsRedirect: "false"
  # The pull secret for AgentMinder's OWN images (admin-svc, ssp-db-initializer,
  # ...). The guide's demo file only sets global.image.pullSecretNames, which
  # the subcharts (NATS, Hazelcast, collector) read but these pods don't: the
  # pre-install dataseed job then pulls anonymously and hangs the install in
  # ImagePullBackOff (lab 2026-10-15). Same key as values/ssp-data.yaml.
  global:
    ssp:
      registry:
        existingSecrets:
        - name: ssp-gcr-registry-creds
  featureFlags:
    aigateway:
      enabled: true       # the in-platform AI Gateway (no separate chart)
    nats:
      enabled: true       # NATS JetStream, required for observability

global:
  image:
    pullSecretNames:
    - ssp-gcr-registry-creds
  observe:
    enabled: true         # AgentMinder agent telemetry -> ClickHouse
  otelAcceptExternalRequests:
    enabled: true         # accept OTLP from outside (e.g. an external AI Gateway)

opentelemetry-collector:
  imagePullSecrets:
  - name: ssp-gcr-registry-creds

nats:
  config:
    cluster:
      enabled: false
      replicas: 1
  # The chart turns on a Prometheus Operator PodMonitor for NATS; no such
  # type on VKS (see the same note in ssp-infra.yaml).
  promExporter:
    podMonitor:
      enabled: false
  global:
    image:
      pullSecretNames:
      - ssp-gcr-registry-creds

hazelcast-enterprise:
  cluster:
    memberCount: 1
  image:
    # The image with the RENEWED Hazelcast Enterprise licence. The one in chart
    # 4.1.0+1578 (5.7.0-p3) carries a licence that expired 29 Sep 2026: the
    # pod exits with InvalidLicenseException and the platform stays down
    # (lab 2026-10-15). Tag and digest from Broadcom's AgentMinder 4.1.1
    # release notes, "Steps to update the Hazelcast license" (for 4.0.2 and
    # later). With a tag set the chart pulls by tag; the digest is recorded so
    # the image can be pinned (set tag "" to pull by digest).
    tag: 5.7.1-p3
    digest: sha256:0c28d9699818d19b0c01176b7c20edbf3af3cd468aef674c043238a4cf161dd2
    # A plain list of names under image.pullSecrets. The guide writes
    # image.imagePullSecrets, which this subchart ignores; its default is a
    # secret ssp-hazelcast-registrypullsecret that nothing creates, so the
    # pull goes out with no credentials and gets 403 (lab 2026-10-15).
    pullSecrets:
    - ssp-gcr-registry-creds
