# kubernetes-mcp-server (containers/kubernetes-mcp-server): Kubernetes as MCP
# tools, CLUSTER-ADMIN on se-pais-001 since 2026-10-18 (user's choice), for the
# AgentMinder-governed Kubernetes agent (docs/agentminder-agents.md):
# read, create/update/delete/scale, run/exec pods, Helm, in every namespace.
#
# Reachable ONLY through AgentMinder's AI Gateway: the pod has no
# mcp.lab/role: server label (agentgateway may not call it), and
# gateway/networkpolicy.yaml kubernetes-mcp-from-agentminder lets in only
# AgentMinder's gateway (and its admin service, for tool discovery). Which tools
# an agent may actually use is AgentMinder's policy, per call.
#
# What this server can do if AgentMinder's policy allows it: anything on the
# cluster, including AgentMinder itself (its pods, database, namespace) and
# RBAC. ArgoCD self-heal reverts changes to objects kept in git; nothing else.
# Back to limited: replace the ClusterRoleBinding with RoleBindings (view/edit).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kubernetes-mcp
  namespace: mcp
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kubernetes-mcp-cluster-admin
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
- kind: ServiceAccount
  name: kubernetes-mcp
  namespace: mcp
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubernetes-mcp
  namespace: mcp
spec:
  replicas: 1
  selector:
    matchLabels: {app: kubernetes-mcp}
  template:
    metadata:
      # No mcp.lab/role: server: agentgateway must not reach a cluster-admin server.
      # mcp.lab/gateway: agentminder = admitted by kubernetes-mcp-from-agentminder.
      labels: {app: kubernetes-mcp, mcp.lab/gateway: agentminder}
    spec:
      serviceAccountName: kubernetes-mcp
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile: {type: RuntimeDefault}
      containers:
      - name: server
        image: quay.io/containers/kubernetes_mcp_server:v0.0.67
        args:
        - --port=8080                  # Streamable HTTP on /mcp
        - --stateless                  # no session affinity needed behind a gateway
        - --toolsets=core,helm         # pods, events, resources (incl. writes) + Helm; no config tools
        - --cluster-provider=in-cluster
        ports:
        - {name: mcp, containerPort: 8080}
        readinessProbe:
          tcpSocket: {port: 8080}
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities: {drop: [ALL]}
        resources:
          requests: {cpu: 50m, memory: 64Mi}
          limits: {memory: 256Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: kubernetes-mcp
  namespace: mcp
spec:
  selector: {app: kubernetes-mcp}
  ports:
  - {name: mcp, port: 8080, targetPort: 8080}
