# kubernetes-mcp-server (containers/kubernetes-mcp-server): Kubernetes as MCP
# tools, for the "ops" agent. READ AND WRITE since 2026-10-18 (user's choice):
# create/update/delete/scale resources, run/exec/delete pods, Helm
# install/uninstall, in pais-db and mcp. What still limits it:
#   RBAC            the built-in "edit" role, only in pais-db and mcp; nothing
#                   cluster-wide, and "edit" cannot change Roles/RoleBindings,
#                   so the agent cannot give itself more rights
#   agentgateway    only the ops agent's key may call these tools
#   ArgoCD          self-heal on the mcp app reverts changes to git-managed
#                   objects there (gateway config, network policies)
# What it can now do, on purpose or by mistake: read and change Secrets in both
# namespaces (e.g. the PAIS database password in pais-db), delete the PAIS
# database, change agentgateway's keys/rules until ArgoCD reverts them.
# Back to read-only: "view" instead of "edit" below, and --read-only.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kubernetes-mcp
  namespace: mcp
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kubernetes-mcp-edit
  namespace: pais-db
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: edit
subjects:
- kind: ServiceAccount
  name: kubernetes-mcp
  namespace: mcp
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kubernetes-mcp-edit
  namespace: mcp
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: edit
subjects:
- kind: ServiceAccount
  name: kubernetes-mcp
  namespace: mcp
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubernetes-mcp
  namespace: mcp
spec:
  replicas: 1
  selector:
    matchLabels: {app: kubernetes-mcp}
  template:
    metadata:
      # mcp.lab/role: server = reachable only from agentgateway (gateway/networkpolicy.yaml)
      labels: {app: kubernetes-mcp, mcp.lab/role: server}
    spec:
      serviceAccountName: kubernetes-mcp
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile: {type: RuntimeDefault}
      containers:
      - name: server
        image: quay.io/containers/kubernetes_mcp_server:v0.0.67
        args:
        - --port=8080                  # Streamable HTTP on /mcp
        - --stateless                  # no session affinity needed behind a gateway
        - --toolsets=core,helm         # pods, events, resources (incl. writes) + Helm; no config tools
        - --cluster-provider=in-cluster
        ports:
        - {name: mcp, containerPort: 8080}
        readinessProbe:
          tcpSocket: {port: 8080}
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities: {drop: [ALL]}
        resources:
          requests: {cpu: 50m, memory: 64Mi}
          limits: {memory: 256Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: kubernetes-mcp
  namespace: mcp
spec:
  selector: {app: kubernetes-mcp}
  ports:
  - {name: mcp, port: 8080, targetPort: 8080}
