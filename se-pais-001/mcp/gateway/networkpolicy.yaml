# The network layer of the demo: the MCP servers (label mcp.lab/role: server)
# accept traffic only from agentgateway, so its keys and tool rules cannot be bypassed from inside the
# cluster. agentgateway itself is open on its port (PAIS reaches it through
# its LoadBalancer VIP; the client address arriving here is the load
# balancer's, so filtering it by source would not mean much).
# Antrea enforces these; kubelet health probes are not blocked by them.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: mcp
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: agentgateway-in
  namespace: mcp
spec:
  podSelector:
    matchLabels: {app: agentgateway}
  policyTypes: [Ingress]
  ingress:
  - ports:
    - {protocol: TCP, port: 3000}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mcp-servers-from-gateway-only
  namespace: mcp
spec:
  # Every MCP server in the marketplace carries this label (servers/*/server.yaml),
  # so a newly published server is fenced in without touching this file.
  podSelector:
    matchLabels: {mcp.lab/role: server}
  policyTypes: [Ingress]
  ingress:
  - from:
    - podSelector:
        matchLabels: {app: agentgateway}
---
# AgentMinder's AI Gateway (se-pais-001, namespace agentminder) is a second
# front door, for lab-facts only: agents registered in AgentMinder call
# lab-facts through it (docs/agentminder-agents.md). Same rule as above: the
# server takes traffic from a gateway, never from an agent directly.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: lab-facts-from-agentminder
  namespace: mcp
spec:
  podSelector:
    matchLabels: {app: lab-facts}
  policyTypes: [Ingress]
  ingress:
  - from:
    - namespaceSelector:
        matchLabels: {kubernetes.io/metadata.name: agentminder}
      podSelector:
        matchLabels: {app: ssp-aigateway}
    ports:
    - {protocol: TCP, port: 8000}
---
# kubernetes-mcp runs as cluster-admin: only AgentMinder may reach it. Its
# gateway carries the agents' tool calls (each checked against AgentMinder's
# policy); its admin service lists the tools when a resource server is set up
# ("Import Tools from MCP Server"). agentgateway is not admitted.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kubernetes-mcp-from-agentminder
  namespace: mcp
spec:
  podSelector:
    matchLabels: {app: kubernetes-mcp}
  policyTypes: [Ingress]
  ingress:
  - from:
    - namespaceSelector:
        matchLabels: {kubernetes.io/metadata.name: agentminder}
      podSelector:
        matchExpressions:
        - {key: app, operator: In, values: [ssp-aigateway, ssp-admin]}
    ports:
    - {protocol: TCP, port: 8080}
