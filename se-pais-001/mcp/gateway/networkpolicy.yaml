# The network layer of the demo: the MCP servers (label mcp.lab/role: server)
# accept traffic only from agentgateway, so its keys and tool rules cannot be bypassed from inside the
# cluster. agentgateway itself is open on its port (PAIS reaches it through
# its LoadBalancer VIP; the client address arriving here is the load
# balancer's, so filtering it by source would not mean much).
# Antrea enforces these; kubelet health probes are not blocked by them.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: mcp
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: agentgateway-in
  namespace: mcp
spec:
  podSelector:
    matchLabels: {app: agentgateway}
  policyTypes: [Ingress]
  ingress:
  - ports:
    - {protocol: TCP, port: 3000}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mcp-servers-from-gateway-only
  namespace: mcp
spec:
  # Every MCP server in the marketplace carries this label (servers/*/server.yaml),
  # so a newly published server is fenced in without touching this file.
  podSelector:
    matchLabels: {mcp.lab/role: server}
  policyTypes: [Ingress]
  ingress:
  - from:
    - podSelector:
        matchLabels: {app: agentgateway}
